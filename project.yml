name: WaveRun
options:
  bundleIdPrefix: com.wireproof
  deploymentTarget:
    iOS: '16.0'
targets:
  WaveRun:
    type: application
    platform: iOS
    sources: [WaveRun]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wireproof.waverun
        PRODUCT_NAME: WaveRun
        CURRENT_PROJECT_VERSION: 6
        MARKETING_VERSION: 0.1.0
        INFOPLIST_KEY_CFBundleDisplayName: Wave Run
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '5.0'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
